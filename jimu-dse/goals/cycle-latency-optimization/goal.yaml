schema_version: 1
name: cycle-latency-optimization
description: Minimize dependency- and resource-scheduled NPU cycles for BERT firmware.
target:
  firmware: firmware/bert/bert_layer.c
  baseline: jimu-dse/baseline/bert_layer.c
  allowed_files: [firmware/bert/bert_layer.c]
  hardware: {dim: 4, hidden: 4, num_head: 2}
  sequence_lengths: [2, 6]
agent:
  backend: opencode
  model: opencode/big-pickle
  timeout_seconds: 1800
  work_budget:
    max_primary_hypotheses: 1
    analysis_deadline_seconds: 600
    edit_deadline_seconds: 900
    return_deadline_seconds: 1500
  context_files:
    - firmware/bert/bert_layer.c
    - jimu-dse/timing/scalesim-parallel-dim4.yaml
prompt:
  goal: Minimize parallel predicted NPU cycles at sequence length 6 using the SCALE-Sim-backed resource schedule.
  constraints:
    - Only modify the configured firmware target.
    - Preserve numerical correctness for the configured BERT cases.
    - Do not modify the timing model, adapter, emulator, tests, or metrics.
    - Optimize parallel_predicted_npu_cycles rather than Python wall-clock time.
  self_verify: Run at most one targeted quick check, then return control; the closed-loop controller runs the complete gates and official score.
  template: |
    You are optimizing {target_file}.
    Goal: {goal_name} — {goal_description}
    Iteration: {iteration}
    Hardware: {hardware}

    Current cycle metrics:
    {metrics}

    The timing backend uses SCALE-Sim v2.0.2 for executed MV_MUL GEMMs and a
    dependency/resource scheduler for traced DRAM, VMM, MMM, MVU, and SPU
    operations. A single shared DRAM bus can overlap with independent compute.
    Optimize the scheduled critical path; legal reordering can improve the
    score even when legacy additive instruction costs are unchanged.

    Scored dataflow evidence:
    {graph_context}

    Start from the reported critical-path events and blocking reasons. Use the
    timing_schedule_file only when the bounded summary is insufficient; do not
    paste or summarize the complete event array into your response.

    Constraints:
    {constraints}

    Apply these skills in order:
    {skills}

    Acceptance gates:
    {gate_commands}
    Self verification: {self_verify}
skills:
  - name: cycle-latency
    path: jimu-dse/docs/skills/isa/cycle-latency.md
  - name: dataflow-optimize
    path: jimu-dse/docs/skills/isa/dataflow-optimize.md
  - name: self-verify
    path: jimu-dse/docs/skills/isa/self-verify.md
probe:
  workload_manifest: jimu-dse/workloads/bert-dim4-seq6.yaml
  timed_device:
    profile: jimu-dse/timing/npu-timed-v1.yaml
  metrics:
    - scalesim_layer_count
    - scalesim_compute_cycles
    - scalesim_stall_cycles
    - trace_memory_cycles
    - auxiliary_cycles
    - predicted_npu_cycles
    - parallel_predicted_npu_cycles
    - overlap_saved_cycles
    - memory_compute_overlap_cycles
    - max_concurrent_ops
    - dram_bus_utilization
    - mvu_utilization
    - vmm_utilization
    - mmm_utilization
    - spu_utilization
    - schedule_chain_count
    - timed_wall_cycles
    - timed_fifo_full_stall_cycles
    - timed_scoreboard_stall_cycles
    - timed_dram_stall_cycles
    - timed_frontend_overflow_count
  scoring_sequence_length: 6
  cycle_model:
    profile: jimu-dse/timing/scalesim-parallel-dim4.yaml
  cycle_limit: 300000
  dag: {enabled: true}
acceptance:
  gates:
    - {name: allowed-files, type: allowed_files}
    - {name: firmware-build, type: build}
    - {name: probe-complete, type: probe}
    - name: numerical-correctness
      type: command
      command: python3 -m pytest tests/integration/test_bert_e2e.py -k "dim{dim} and h{hidden}" --no-header -q
      timeout_seconds: 600
      success_codes: [0]
  score:
    - {metric: parallel_predicted_npu_cycles, direction: minimize, weight: 1.0}
loop:
  mode: goal_driven
  max_iterations: 20
  min_score_delta: 0.001
  max_no_improvement: 20
  target_score: 0.10
  evaluate_timeout_candidate: true
artifacts:
  save_candidates: true
  save_diffs: true
  save_prompts: true
  save_probes: true
  save_graphs: true
