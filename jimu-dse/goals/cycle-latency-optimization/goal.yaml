schema_version: 1
name: cycle-latency-optimization
description: Minimize SCALE-Sim-backed predicted NPU cycles for BERT firmware.
target:
  firmware: firmware/bert/bert_layer.c
  baseline: jimu-dse/baseline/bert_layer.c
  allowed_files: [firmware/bert/bert_layer.c]
  hardware: {dim: 4, hidden: 4, num_head: 2}
  sequence_lengths: [2, 6]
agent:
  backend: opencode
  model: opencode/big-pickle
  timeout_seconds: 1800
  context_files:
    - firmware/bert/bert_layer.c
    - jimu-dse/timing/scalesim-dim4.yaml
prompt:
  goal: Minimize predicted NPU cycles at sequence length 6 using the SCALE-Sim-backed timing breakdown.
  constraints:
    - Only modify the configured firmware target.
    - Preserve numerical correctness for the configured BERT cases.
    - Do not modify the timing model, adapter, emulator, tests, or metrics.
    - Optimize predicted_npu_cycles rather than Python wall-clock time.
  self_verify: Run all configured scope, build, probe, and numerical-correctness gates.
  template: |
    You are optimizing {target_file}.
    Goal: {goal_name} — {goal_description}
    Iteration: {iteration}
    Hardware: {hardware}

    Current cycle metrics:
    {metrics}

    The timing backend uses SCALE-Sim v2.0.2 for executed MV_MUL GEMMs,
    explicit EventTracer DRAM operations for memory cycles, and a protected
    timing profile for all auxiliary instructions. SCALE-Sim stall cycles are
    diagnostic and excluded from the total by default to avoid double-counting
    explicit firmware memory operations.

    DAG/cluster observations:
    {clusters}

    Constraints:
    {constraints}

    Apply these skills in order:
    {skills}

    Acceptance gates:
    {gate_commands}
    Self verification: {self_verify}
skills:
  - name: cycle-latency
    path: jimu-dse/docs/skills/isa/cycle-latency.md
  - name: dag-analyze
    path: jimu-dse/docs/skills/isa/dag-analyze.md
  - name: vrf-cache
    path: jimu-dse/docs/skills/isa/vrf-cache.md
  - name: self-verify
    path: jimu-dse/docs/skills/isa/self-verify.md
probe:
  metrics:
    - scalesim_layer_count
    - scalesim_compute_cycles
    - scalesim_stall_cycles
    - trace_memory_cycles
    - auxiliary_cycles
    - predicted_npu_cycles
  scoring_sequence_length: 6
  cycle_model:
    profile: jimu-dse/timing/scalesim-dim4.yaml
  cycle_limit: 300000
  dag: {enabled: true}
acceptance:
  gates:
    - {name: allowed-files, type: allowed_files}
    - {name: firmware-build, type: build}
    - {name: probe-complete, type: probe}
    - name: numerical-correctness
      type: command
      command: python3 -m pytest tests/integration/test_bert_e2e.py -k "dim{dim} and h{hidden}" --no-header -q
      timeout_seconds: 600
      success_codes: [0]
  score:
    - {metric: predicted_npu_cycles, direction: minimize, weight: 1.0}
loop:
  max_iterations: 20
  min_score_delta: 0.001
  max_no_improvement: 20
artifacts:
  save_candidates: true
  save_diffs: true
  save_prompts: true
  save_probes: true
  save_graphs: true
